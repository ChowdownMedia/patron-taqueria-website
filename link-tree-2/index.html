<style>
:root{
  --cream:#F7ECD6;--cream-lt:#FFF3DE;--ink:#2A1B12;--muted:#5A4A3E;
  --amber:#F5A623;--green:#1B5E3A;--red:#D6291F;--white:#fff;
  --f-display:"Abril Fatface",Georgia,serif;--f-body:"Hanken Grotesque",system-ui,-apple-system,sans-serif;
  --radius:16px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  background:
    radial-gradient(900px 420px at 50% -8%, rgba(245,166,35,.22) 0%, transparent 58%),
    radial-gradient(760px 380px at 50% 108%, rgba(27,94,58,.14) 0%, transparent 60%),
    var(--cream);
}
img{max-width:100%;display:block}
a{color:var(--red);text-decoration:none}
h1{font-family:var(--f-display);font-weight:400;line-height:1;margin:0;color:var(--ink)}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:12px}

.wrap{width:100%;max-width:460px;padding:40px 20px 32px;text-align:center}
.logo{max-width:180px;height:auto;margin:0 auto 16px;filter:drop-shadow(0 8px 22px rgba(42,27,18,.28))}
h1{font-size:clamp(2rem,8vw,2.7rem)}
.loc{display:inline-block;margin:12px 0 0;padding:5px 14px;border:2px solid var(--ink);border-radius:999px;
  background:var(--cream-lt);font-weight:800;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.rule{height:5px;width:120px;margin:20px auto 26px;border-radius:5px;
  background:repeating-linear-gradient(90deg,var(--red) 0 16px,var(--amber) 16px 32px,var(--green) 32px 48px)}

.links{display:flex;flex-direction:column;gap:15px}
.link{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--radius);
  font-family:var(--f-body);font-weight:800;font-size:1.06rem;letter-spacing:-.01em;
  background:var(--cream-lt);color:var(--ink);border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
  transition:transform .12s ease,box-shadow .12s ease}
.link:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.link:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.link .ic{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
  border-radius:11px;border:2px solid var(--ink);color:var(--ink)}
.link .ic svg{width:20px;height:20px}
.link .lbl{flex:1 1 auto;text-align:left}
.link .arw{flex:0 0 auto}
.link .arw svg{width:18px;height:18px}
.link--amber{background:var(--amber)}
.link--amber .ic{background:var(--cream-lt)}
.link--green{background:var(--green);color:var(--cream-lt);border-color:var(--ink);box-shadow:5px 5px 0 var(--ink)}
.link--green .ic{border-color:var(--cream-lt);color:var(--cream-lt)}
.link--red{background:var(--red);color:var(--cream-lt)}
.link--red .ic{border-color:var(--cream-lt);color:var(--cream-lt)}

.foot{margin:32px 0 4px;font-size:.82rem;color:var(--muted)}
.foot a{color:var(--ink);font-weight:700}
</style>
</head>
